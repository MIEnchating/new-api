name: Release (Linux, macOS, Windows)
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      name:
        description: "reason"
        required: false
  push:
    tags:
      - "*"
      - "!*-alpha*"

jobs:
  validate_tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Enforce release version sequence
        if: startsWith(github.ref, 'refs/tags/')
        run: node .github/scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"

  preflight:
    name: Mandatory Release Preflight
    if: startsWith(github.ref, 'refs/tags/')
    needs: validate_tag
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GOWORK: 'off'
    steps:
      - name: Checkout release commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
      - name: Validate release notes and generated output
        run: |
          node .github/scripts/validate-release-tag.mjs "$GITHUB_REF_NAME"
          node .github/scripts/generate-release-notes.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Frontend typecheck
        working-directory: web
        run: bun run typecheck
      - name: Frontend lint
        working-directory: web
        run: bun run lint
      - name: Frontend format check
        working-directory: web
        run: bun run format:check
      - name: Frontend production build
        working-directory: web
        env:
          CI: ''
          DISABLE_ESLINT_PLUGIN: 'true'
          VITE_REACT_APP_VERSION: ${{ github.ref_name }}
        run: bun run build
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            relaykit/go.sum
      - name: Download Go dependencies with retry
        run: |
          for attempt in 1 2 3; do
            if go mod download; then
              break
            fi
            echo "go mod download failed (attempt ${attempt}/3)" >&2
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
      - name: Go tests
        run: go test ./...
      - name: relaykit tests
        working-directory: relaykit
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: relaykit vet
        working-directory: relaykit
        run: go vet ./...
      - name: Docker build preflight
        run: docker build --pull=false --tag "new-api-release-preflight:${GITHUB_REF_NAME}" .

  linux:
    name: Linux Release
    needs: [validate_tag, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$VERSION" bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ">=1.25.1"
      - name: Build Backend (amd64)
        run: |
          for attempt in 1 2 3; do
            if go mod download; then break; fi
            echo "go mod download failed (attempt ${attempt}/3)" >&2
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o "new-api-linux-amd64-$VERSION"
      - name: Build Backend (arm64)
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y gcc-aarch64-linux-gnu
          CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION' -extldflags '-static'" -o "new-api-linux-arm64-$VERSION"
      - name: Upload Linux builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-builds
          path: new-api-linux-*
          if-no-files-found: error

  macos:
    name: macOS Release
    needs: [validate_tag, preflight]
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$VERSION" bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ">=1.25.1"
      - name: Build Backend
        run: |
          for attempt in 1 2 3; do
            if go mod download; then break; fi
            echo "go mod download failed (attempt ${attempt}/3)" >&2
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
          go build -ldflags "-X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o "new-api-macos-amd64-$VERSION"
      - name: Upload macOS build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build
          path: new-api-macos-amd64-*
          if-no-files-found: error

  windows:
    name: Windows Release
    needs: [validate_tag, preflight]
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Determine Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(git describe --tags --match 'v[0-9]*')
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.0'
      - name: Build Frontend
        env:
          CI: ""
        run: |
          cd web
          bun install --frozen-lockfile
          DISABLE_ESLINT_PLUGIN='true' VITE_REACT_APP_VERSION="$VERSION" bun run build
          cd ..
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ">=1.25.1"
      - name: Build Backend
        run: |
          for attempt in 1 2 3; do
            if go mod download; then break; fi
            echo "go mod download failed (attempt ${attempt}/3)" >&2
            if [[ "$attempt" == 3 ]]; then exit 1; fi
            sleep $((attempt * 10))
          done
          go build -ldflags "-s -w -X 'github.com/QuantumNous/new-api/common.Version=$VERSION'" -o "new-api-windows-amd64-$VERSION.exe"
      - name: Upload Windows build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build
          path: new-api-windows-amd64-*.exe
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Download builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Require complete release artifacts
        run: |
          expected=(
            "new-api-linux-amd64-${GITHUB_REF_NAME}"
            "new-api-linux-arm64-${GITHUB_REF_NAME}"
            "new-api-macos-amd64-${GITHUB_REF_NAME}"
            "new-api-windows-amd64-${GITHUB_REF_NAME}.exe"
          )
          actual_count=$(find release-assets -maxdepth 1 -type f | wc -l)
          if [[ "$actual_count" != "${#expected[@]}" ]]; then
            echo "Expected ${#expected[@]} release artifacts, found ${actual_count}" >&2
            find release-assets -maxdepth 1 -type f -print >&2
            exit 1
          fi
          for artifact in "${expected[@]}"; do
            if [[ ! -s "release-assets/$artifact" ]]; then
              echo "Missing or empty release artifact: $artifact" >&2
              exit 1
            fi
          done
      - name: Generate standardized release notes
        run: node .github/scripts/generate-release-notes.mjs "$GITHUB_REF_NAME" release-notes.md
      - name: Publish release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: release-assets/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
