<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <!-- Resolve the theme before first paint so the page never flashes light
         and one-shot detectors (e.g. Dark Reader) see the real theme.
         Keep in sync with ThemeProvider and THEME_STORAGE_KEYS.mode. -->
    <script>
      ;(function () {
        var theme = 'system'
        try {
          theme = localStorage.getItem('newapi:theme:v1:mode') || 'system'
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
      }

      /* Shared by the HTML bootstrap and LoadingState's page variant. Inline
         styles keep the very first paint independent of the application bundle. */
      .app-loading-screen {
        --loading-surface: #f8faff;
        --loading-card: #fff;
        --loading-blue: #2b5cbe;
        --loading-line: #dce7fb;
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: radial-gradient(
          ellipse at 50% 45%,
          #eaf1ff 0,
          var(--loading-surface) 58%
        );
        color: var(--loading-blue);
      }
      .app-loading-screen::before {
        content: '';
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--loading-line) 1px, transparent 1px),
          linear-gradient(90deg, var(--loading-line) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse at center, #0005, transparent 65%);
        pointer-events: none;
      }
      .app-loading-progress {
        position: absolute;
        inset: 0 0 auto;
        height: 2px;
        overflow: hidden;
        background: var(--loading-line);
      }
      .app-loading-progress::after {
        content: '';
        display: block;
        height: 100%;
        width: 32%;
        background: linear-gradient(
          90deg,
          transparent,
          var(--loading-blue),
          transparent
        );
        animation: app-loading-progress 2.2s ease-in-out infinite;
      }
      .app-loading-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: min(320px, calc(100vw - 48px));
        aspect-ratio: 1;
      }
      .app-loading-ring {
        position: absolute;
        inset: 12%;
        border: 1px solid var(--loading-line);
        border-radius: 50%;
        animation: app-loading-orbit 8s linear infinite;
      }
      .app-loading-ring::before {
        content: '';
        position: absolute;
        top: -4px;
        left: calc(50% - 4px);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--loading-blue);
        box-shadow: 0 0 0 5px
          color-mix(in srgb, var(--loading-blue) 9%, transparent);
      }
      .app-loading-ring-outer {
        inset: 0;
        opacity: 0.55;
        animation-duration: 12s;
        animation-direction: reverse;
        animation-delay: -4s;
      }
      .app-loading-core {
        display: grid;
        place-items: center;
        width: 88px;
        height: 88px;
        border: 1px solid var(--loading-line);
        border-radius: 26px;
        background: var(--loading-card);
        box-shadow:
          0 16px 48px -16px #2b5cbe40,
          0 0 0 12px color-mix(in srgb, var(--loading-card) 50%, transparent);
        animation: app-loading-breathe 3s ease-in-out infinite;
      }
      .app-loading-core svg {
        width: 38px;
        height: 38px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .app-loading-dots {
        position: absolute;
        bottom: -36px;
        display: flex;
        gap: 8px;
      }
      .app-loading-dots i {
        width: 4px;
        height: 4px;
        border-radius: 50%;
        background: currentColor;
        opacity: 0.3;
        animation: app-loading-breathe 1.8s ease-in-out infinite;
      }
      .app-loading-dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      .app-loading-dots i:nth-child(3) {
        animation-delay: 0.4s;
      }
      :root.dark .app-loading-screen {
        --loading-surface: #101827;
        --loading-card: #19263d;
        --loading-blue: #83b0ff;
        --loading-line: #263958;
        background: radial-gradient(
          ellipse at 50% 45%,
          #1a2b49 0,
          var(--loading-surface) 58%
        );
      }
      @keyframes app-loading-orbit {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes app-loading-progress {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(412.5%);
        }
      }
      @keyframes app-loading-breathe {
        50% {
          opacity: 0.7;
          transform: translateY(-3px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-loading-screen .app-loading-mark *,
        .app-loading-screen::before,
        .app-loading-screen *::after {
          animation: none;
        }
        .app-loading-ring-outer {
          transform: rotate(120deg);
        }
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <script id="app-bootstrap-theme">
      // Match the saved appearance before the application bundle loads.
      ;(function () {
        var theme = window.matchMedia('(prefers-color-scheme: dark)').matches
          ? 'dark'
          : 'light'
        try {
          // Keep aligned with THEME_STORAGE_KEYS in src/lib/theme-storage.ts.
          // Legacy cookies can belong to another instance on the same host.
          var mode = window.localStorage.getItem('newapi:theme:v1:mode')
          if (mode === 'light' || mode === 'dark') theme = mode
          var preset = window.localStorage.getItem('newapi:theme:v1:preset')
          if (preset) {
            // Keep aligned with THEME_PRESETS in src/lib/theme-customization.ts.
            var presets = [
              'anthropic',
              'simple-large',
              'underground',
              'rose-garden',
              'lake-view',
              'sunset-glow',
              'forest-whisper',
              'ocean-breeze',
              'lavender-dream',
            ]
            if (presets.includes(preset)) {
              document.body.setAttribute('data-theme-preset', preset)
            }
          }
        } catch {
          // System appearance remains available when storage cannot be read.
        }
        document.documentElement.classList.add(theme)
      })()
    </script>
    <div id="root" translate="no" class="notranslate">
      <div id="app-bootstrap" class="app-loading-screen">
        <div
          id="app-bootstrap-progress"
          class="app-loading-progress"
          role="progressbar"
          aria-label="Loading"
        ></div>
        <div
          id="app-bootstrap-mark"
          class="app-loading-mark"
          aria-hidden="true"
        >
          <div class="app-loading-ring app-loading-ring-outer"></div>
          <div class="app-loading-ring"></div>
          <div class="app-loading-core">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="m12 3 9 5-9 5-9-5 9-5Z" />
              <path d="m3 12 9 5 9-5M3 16l9 5 9-5" />
            </svg>
          </div>
          <div class="app-loading-dots"><i></i><i></i><i></i></div>
        </div>
      </div>
    </div>
  </body>
</html>
