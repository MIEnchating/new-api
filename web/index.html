<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/jpeg"
      href="/logo.png?v=20260721-4"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
      }

      #app-bootstrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fafafa;
      }

      #app-bootstrap-mark {
        position: relative;
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
      }

      #app-bootstrap-mark::before {
        position: absolute;
        inset: 0;
        border: 2px solid #e5e7eb;
        border-top-color: #18181b;
        border-radius: 50%;
        content: '';
        animation: app-bootstrap-spin 0.8s linear infinite;
      }

      #app-bootstrap-mark img {
        width: 26px;
        height: 26px;
        object-fit: contain;
      }

      @keyframes app-bootstrap-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-color-scheme: dark) {
        #app-bootstrap {
          background: #09090b;
        }

        #app-bootstrap-mark::before {
          border-color: #27272a;
          border-top-color: #fafafa;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-bootstrap-mark::before {
          animation: none;
        }
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate">
      <div id="app-bootstrap" aria-hidden="true">
        <div id="app-bootstrap-mark">
          <img src="/logo.png?v=20260721-4" alt="" />
        </div>
      </div>
    </div>
  </body>
</html>
