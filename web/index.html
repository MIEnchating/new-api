<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
      }

      #app-bootstrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fafafa;
      }

      #app-bootstrap-progress {
        position: fixed;
        z-index: 1;
        top: 0;
        left: 0;
        width: 100%;
        height: 3px;
        overflow: hidden;
        background: rgba(37, 99, 235, 0.12);
      }

      #app-bootstrap-progress-bar {
        width: 32%;
        height: 100%;
        background: #2563eb;
        animation: app-bootstrap-progress 1.35s ease-in-out infinite;
      }

      #app-bootstrap-mark {
        position: relative;
        width: 116px;
        height: 116px;
      }

      .app-bootstrap-track,
      .app-bootstrap-orbit {
        position: absolute;
        border-radius: 50%;
      }

      .app-bootstrap-track-outer {
        inset: 7px;
        border: 1px solid rgba(37, 99, 235, 0.16);
      }

      .app-bootstrap-track-inner {
        inset: 25px;
        border: 1px solid rgba(15, 118, 110, 0.15);
      }

      .app-bootstrap-orbit-outer {
        inset: 7px;
        border: 1px solid transparent;
        border-top-color: rgba(37, 99, 235, 0.72);
        border-right-color: rgba(37, 99, 235, 0.24);
        animation: app-bootstrap-orbit 3.2s linear infinite;
      }

      .app-bootstrap-orbit-inner {
        inset: 25px;
        border: 1px solid transparent;
        border-bottom-color: rgba(15, 118, 110, 0.72);
        border-left-color: rgba(15, 118, 110, 0.24);
        animation: app-bootstrap-orbit-reverse 2.4s linear infinite;
      }

      .app-bootstrap-orbit::before,
      .app-bootstrap-orbit::after {
        position: absolute;
        border: 2px solid #fafafa;
        border-radius: 50%;
        content: '';
      }

      .app-bootstrap-orbit-outer::before {
        top: 10px;
        right: 7px;
        width: 8px;
        height: 8px;
        background: #2563eb;
        box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
      }

      .app-bootstrap-orbit-outer::after {
        bottom: 8px;
        left: 12px;
        width: 6px;
        height: 6px;
        background: #d97706;
        box-shadow: 0 0 0 4px rgba(217, 119, 6, 0.1);
      }

      .app-bootstrap-orbit-inner::before {
        top: 2px;
        left: 12px;
        width: 7px;
        height: 7px;
        background: #0f766e;
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.1);
      }

      .app-bootstrap-orbit-inner::after {
        right: 4px;
        bottom: 9px;
        width: 5px;
        height: 5px;
        background: #60a5fa;
        box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.1);
      }

      .app-bootstrap-core {
        position: absolute;
        top: 43px;
        left: 43px;
        width: 26px;
        height: 26px;
        border: 2px solid #2563eb;
        border-radius: 8px;
        background: #fafafa;
        box-shadow:
          0 0 0 7px rgba(37, 99, 235, 0.09),
          0 0 22px rgba(37, 99, 235, 0.24);
        animation: app-bootstrap-core-pulse 1.6s ease-in-out infinite;
      }

      .app-bootstrap-core::after {
        position: absolute;
        inset: 8px;
        border-radius: 2px;
        background: #2563eb;
        content: '';
      }

      @keyframes app-bootstrap-orbit {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes app-bootstrap-orbit-reverse {
        to {
          transform: rotate(-360deg);
        }
      }

      @keyframes app-bootstrap-core-pulse {
        0%,
        100% {
          opacity: 0.72;
          transform: scale(0.86);
        }

        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes app-bootstrap-progress {
        0% {
          transform: translateX(-125%);
        }

        50% {
          transform: translateX(185%);
        }

        100% {
          transform: translateX(340%);
        }
      }

      @media (prefers-color-scheme: dark) {
        #app-bootstrap {
          background: #09090b;
        }

        #app-bootstrap-progress {
          background: rgba(96, 165, 250, 0.18);
        }

        #app-bootstrap-progress-bar {
          background: #60a5fa;
        }

        .app-bootstrap-track-outer {
          border-color: rgba(96, 165, 250, 0.2);
        }

        .app-bootstrap-track-inner {
          border-color: rgba(94, 234, 212, 0.17);
        }

        .app-bootstrap-orbit::before,
        .app-bootstrap-orbit::after {
          border-color: #09090b;
        }

        .app-bootstrap-core {
          background: #09090b;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-bootstrap-orbit,
        .app-bootstrap-core {
          animation: none;
        }

        #app-bootstrap-progress-bar {
          animation: none;
          width: 55%;
          transform: translateX(0);
        }
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate">
      <div id="app-bootstrap" aria-hidden="true">
        <div
          id="app-bootstrap-progress"
          role="progressbar"
          aria-label="Loading"
        >
          <div id="app-bootstrap-progress-bar"></div>
        </div>
        <div id="app-bootstrap-mark">
          <span class="app-bootstrap-track app-bootstrap-track-outer"></span>
          <span class="app-bootstrap-track app-bootstrap-track-inner"></span>
          <span class="app-bootstrap-orbit app-bootstrap-orbit-outer"></span>
          <span class="app-bootstrap-orbit app-bootstrap-orbit-inner"></span>
          <span class="app-bootstrap-core"></span>
        </div>
      </div>
    </div>
  </body>
</html>
