<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />

    <!-- Primary Meta Tags -->
    <title>New API</title>
    <meta name="title" content="New API" />
    <meta
      name="description"
      content="Unified AI API gateway and admin dashboard."
    />

    <meta name="theme-color" content="#fff" />
    <style>
      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
      }

      #app-bootstrap {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #fafafa;
      }

      #app-bootstrap-mark {
        display: flex;
        width: 68px;
        height: 36px;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }

      #app-bootstrap-mark span {
        width: 4px;
        height: 30px;
        border-radius: 999px;
        background: #18181b;
        opacity: 0.24;
        transform: scaleY(0.38);
        animation: app-bootstrap-wave 1.05s ease-in-out infinite;
      }

      #app-bootstrap-mark span:nth-child(1) {
        animation-delay: -0.42s;
      }

      #app-bootstrap-mark span:nth-child(2) {
        animation-delay: -0.3s;
      }

      #app-bootstrap-mark span:nth-child(3) {
        animation-delay: -0.18s;
      }

      #app-bootstrap-mark span:nth-child(4) {
        animation-delay: -0.06s;
      }

      #app-bootstrap-mark span:nth-child(5) {
        animation-delay: 0.06s;
      }

      #app-bootstrap-mark span:nth-child(6) {
        animation-delay: 0.18s;
      }

      #app-bootstrap-mark span:nth-child(7) {
        animation-delay: 0.3s;
      }

      @keyframes app-bootstrap-wave {
        0%,
        100% {
          opacity: 0.24;
          transform: scaleY(0.38);
        }

        50% {
          opacity: 1;
          transform: scaleY(1);
        }
      }

      @media (prefers-color-scheme: dark) {
        #app-bootstrap {
          background: #09090b;
        }

        #app-bootstrap-mark span {
          background: #fafafa;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-bootstrap-mark span {
          animation: none;
          opacity: 0.6;
          transform: scaleY(0.62);
        }
      }
    </style>
    <!--umami-->
    <!--Google Analytics-->
  </head>

  <body>
    <div id="root" translate="no" class="notranslate">
      <div id="app-bootstrap" aria-hidden="true">
        <div id="app-bootstrap-mark">
          <span></span><span></span><span></span><span></span><span></span
          ><span></span><span></span>
        </div>
      </div>
    </div>
  </body>
</html>
